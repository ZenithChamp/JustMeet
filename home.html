<html>
  <head>
  <style>
    body{
            background-image: url('/static/RegH.png'); 
            background-size: cover;                  
            background-position: center;            
            background-repeat: no-repeat;           
            background-attachment: fixed;  
        }
    .title{
      font-weight:bold;
      font-size:58px;
      font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      font-style:bold;
      color:rgba(232, 185, 31, 0.777);
      margin-bottom:1px;
    }
    .tt{
    border:2px solid gray;
    border-radius:10px;
    margin-left:20px;
    text-align:center;
    background-color: rgba(0, 0, 0, 0.65); 
    color:white;
    background-size: cover;                  
    background-position: center;            
    background-repeat: no-repeat;           
    background-attachment: fixed;  
    padding: 6px 12px; 
    font-size: 0.85rem; 
    white-space: nowrap; 
    width:250px; 
    max-width: 100%; 
}
.login{
  border:2px solid gray;
    border-radius:10px;
    margin-right:3px;
    text-align:center;
    background-color: white; 
    color:black;
    background-size: cover;                  
    background-position: center;            
    background-repeat: no-repeat;           
    background-attachment: fixed;  
    padding: 6px 12px; 
    font-size: 0.85rem; 
    white-space: nowrap; 
    width:150px; 
    height:45px;
    max-width: 100%; 
    position: absolute;
    right: 30px;
    top:30px;
    cursor:pointer;
}
.main-content{
    display:flex;
}
.sidepanel {
  height: 100%;
  width: 0; 
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;  
  transition: 0.3s ease; 
  padding-top: 60px;
}
.sidepanel a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: white;
  font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  display: block;
  transition: 0.3s;
}
.sidepanel a:hover {
  color: #f1f1f1;
}
.closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}
.openbtn{
    background-color:transparent;
    color:white;
    cursor:pointer;
    font-weight:bold;
    font-size:25px;
    height:50px;
    width:50px;
}
.user-area {
    position: absolute;
    top: 30px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 15px;
}
.home-dp {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid white;
}
.logout-btn {
    background-color: white;
    color: black;
    border: 2px solid gray;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.logout-btn:hover {
    background-color: #ddd;
}
.user-name {
    color: white;
    font-size: 18px;
    font-weight: bold;
}
  </style></head>
  <body>
    <h1 class="title">Just Meet</h1>
<div class="user-area">
    {% if session.get('regno') %}
        <img
            src="{{ url_for('static', filename='profile_pictures/' + session['regno'] + '.png') }}"
            class="home-dp"
            onclick="location.href='/profile'"
            alt="Profile">
        <div class="user-name">
            {{ user.username }}
        </div>
        <button class="logout-btn" onclick="location.href='/logout'">
            Logout
        </button>
    {% else %}
        <button class="logout-btn" onclick="location.href='/login'">
            Login
        </button>
    {% endif %}
</div>
  <div id="mySidepanel" class="sidepanel">
  <button class="closebtn" onclick="closeNav()">&times;</button>
  <a href="/">Home</a>
  <a href="/timetable">Time Table</a>
  <a href="#">Friends</a>
  <a href="/profile">Profile</a>
  <a href="/register">Register</a>
  <a href="#">Contact</a>
  </div>
<div class="main-content">
  <button class="openbtn" onclick="openNav()">&#9776; </button> 
  <div class="tt" onclick="location.href='/timetable'">
    <p style="font-size:30px; font-weight:bold;">Time Table</p>
    <p id="day-of-week"></p>
    <p id="clock-time"></p>
  </div>
</div>
<script>
        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
        function updateDay(){
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const now = new Date();
            const currentDayIndex = now.getDay();
            console.log(now.toLocaleTimeString()); 
            document.getElementById('day-of-week').textContent = days[currentDayIndex];
            document.getElementById('clock-time').textContent = now.toLocaleTimeString();
        }
        window.onload = updateDay;
        setInterval(updateDay, 1000);
    </script>
  </body>
</html>
