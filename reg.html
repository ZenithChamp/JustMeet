<html>
    <head>
        <style>
        body{
            display: flex;
            justify-content: center;    
            align-items: center;     
            height: 100vh;           
            margin: 0;  
            background-image: url('jm.png'); 
            background-size: cover;                  
            background-position: center;            
            background-repeat: no-repeat;           
            background-attachment: fixed;  
        }
        .Reg{
            border:2px solid gray;
            width:375px;
            height:200px;
            padding:15px;
            border-radius:18px;
            font-size:20;
            text-align:center;
            color:white;
            background-color:rgb(67, 9, 116);
        }
        .submit{
            background-color:rgb(38, 16, 202);
            color:white;
            height:36px;
            width:74px;
            border:none;
            border-radius:18px;
            font-weight:bold;
            font-size:15;
            cursor:pointer;
            transition: box-shadow 0.15s;
            color: 0.15s;
        }
        </style>
    </head>
    <body style="background-color: lightgrey;">
        <div class="Reg">
            <form action="home.html">
                <label for="fname">Full name:</label><br>
                <input type="text" id="fname" name="fname" placeholder="Enter Name" required ><br>
                <label for="regno">Registration no:</label><br>
                <input type="text" id="regno" name="regno" placeholder="Enter Name" required><br>
                <label for="password">Password:</label><br>
                <input type="text" id="password" name="password" placeholder="Enter Name" required><br><br>
                <button type="submit" class="Submit">Submit</button>
            </form>
        </div>
    </body>
</html>
