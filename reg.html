<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background: url("/static/RegP.png") center / cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .Reg {
            width: 450px;
            padding: 20px;
            border-radius: 18px;
            font-size: 25px;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            background-color: transparent;
            margin-top:250px;
        }
        .submit {
            background-color: rgb(73, 70, 99);
            color: white;
            height: 45px;
            width: 250px;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .usr {
            font-size: 30px;
            font-family: 'Courier New', Courier, monospace;
        }
        .sidepanel {
  height: 100%;
  width: 0; 
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;  
  transition: 0.3s ease; 
  padding-top: 60px;
}

.sidepanel a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: white;
  font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  display: block;
  transition: 0.3s;
}

.sidepanel a:hover {
  color: #f1f1f1;
}
.closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}
.openbtn {
    position: fixed;
    top: 20px;
    left: 20px;
    background-color: transparent;
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 25px;
    height: 50px;
    width: 50px;
    border: none;
    z-index: 999;
}
    </style>
</head>
<body>
    <button class="openbtn" onclick="openNav()">&#9776;</button>
    <div id="mySidepanel" class="sidepanel">
  <button class="closebtn" onclick="closeNav()">&times;</button>
  <a href="/">Home</a>
  <a href="/timetable">Time Table</a>
  <a href="#">Friends</a>
  <a href="/profile">Profile</a>
  <a href="/register">Register</a>
  <a href="#">Contact</a>
  </div>
    <div class="Reg">
        <form action="/register" method="POST">
            <label class="usr"
                   style="display:block; text-align:center;">
                USER REGISTRATION
            </label>
            <br>
            <label for="fname">Full name:</label>
            <input
                type="text"
                id="fname"
                name="fname"
                placeholder="Enter Name"
                required>
            <br>
            <label for="regno">Registration no:</label>
            <input
                type="text"
                id="regno"
                name="regno"
                placeholder="Enter Registration no"
                required>
            <br>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required>
            <br><br>
            <div style="text-align:center;">
                <button type="submit" class="submit">
                    Register
                </button>
            </div>
        </form>
    </div>
    <script>
        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
    </script>
</body>
</html>
