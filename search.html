<html>
<head>
<style>
body {
    background-image: url('/static/RegH.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
.title {
    font-weight: bold;
    font-size: 58px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: rgba(232, 185, 31, 0.777);
    margin-bottom: 0px;
}
.sidepanel {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    background-color: #111;
    overflow-x: hidden;
    transition: 0.3s ease;
    padding-top: 60px;
}
.sidepanel a {
    padding: 8px 8px 8px 32px;
    text-decoration: none;
    font-size: 25px;
    color: white;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    display: block;
}
.sidepanel a:hover {
    color: #f1f1f1;
}
.closebtn {
    position: absolute;
    top: 0;
    right: 25px;
    font-size: 36px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}
.openbtn {
    background-color: transparent;
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 25px;
    height: 50px;
    width: 50px;
}
.main-content {
    display: flex;
}
.searchbox {
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    text-align: center;
}
.searchbox-title {
    color: white;
    font-family: 'Courier New', Courier, monospace;
    font-size: 30px;
    margin-bottom: 20px;
}
.search-form {
    display: flex;
    width: 700px;
    height: 60px;
    border: 2px solid #333;
    border-radius: 35px;
    overflow: hidden;
    background-color: #111;
}
.search-input {
    flex: 1;
    background-color: #111;
    color: white;
    border: none;
    outline: none;
    padding: 0 25px;
    font-size: 20px;
}
.search-input::placeholder {
    color: #888;
}
.search-button {
    width: 140px;
    background-color: #004085;
    color: white;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
.search-button:hover {
    background-color: #002752;
}
.profile-result {
    width: 500px;
    margin: 30px auto 0 auto;
    padding: 25px;
    background-color: rgba(0, 0, 0, 0.75);
    border: 2px solid #555;
    border-radius: 20px;
    color: white;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}
.profile-result:hover {
    transform: scale(1.02);
    border-color: white;
}
.home-dp {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
}
</style>
</head>
<body>
<p class="title">Just Meet</p>
<div id="mySidepanel" class="sidepanel">
    <button class="closebtn" onclick="closeNav()">&times;</button>
    <a href="/">Home</a>
    <a href="/search">Search</a>
    <a href="/timetable">Time Table</a>
    <a href="/friends">Friends</a>
    <a href="/profile">Profile</a>
    <a href="/register">Register</a>
    <a href="#">Contact</a>
</div>
<div class="main-content">
    <button class="openbtn" onclick="openNav()">&#9776;</button>
    <div class="searchbox">
        <div class="searchbox-title">
            Search
        </div>
        <form action="/search" method="GET" class="search-form">
            <input
                type="search"
                name="q"
                class="search-input"
                placeholder="Enter Registration No..."
                required
            >
            <button type="submit" class="search-button">
                Search
            </button>
        </form>
{% if searched_regno and user %}
<a href="/profile/{{ searched_regno }}" style="text-decoration: none;">
    <div class="profile-result">
        <img
            src="{{ url_for('static', filename=user.profile_picture if user.profile_picture else 'default_avatar.png') }}"
            class="home-dp"
            alt="Profile"
        >
        <h2>{{ user.username }}</h2>
        <p>Registration No: {{ user.regno }}</p>
    </div>
</a>
{% elif searched_regno and not user %}
<div class="profile-result">
    <h2>User Not Found</h2>
    <p>
        No account exists with registration number
        {{ searched_regno }}
    </p>
</div>
{% endif %}
    </div>
</div>
<script>
function openNav() {
    document.getElementById("mySidepanel").style.width = "250px";
}
function closeNav() {
    document.getElementById("mySidepanel").style.width = "0";
}
</script>
</body>
</html>
