<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background: url("/static/RegP.png") center / cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .Reg {
            width: 450px;
            padding: 20px;
            border-radius: 18px;
            font-size: 25px;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            background-color: transparent;
            margin-top:250px;
        }
        .submit {
            background-color: rgb(73, 70, 99);
            color: white;
            height: 45px;
            width: 250px;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .usr {
            font-size: 30px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <div class="Reg">
        <form action="/register" method="POST">
            <label class="usr"
                   style="display:block; text-align:center;">
                USER REGISTRATION
            </label>
            <br>
            <label for="fname">Full name:</label>
            <input
                type="text"
                id="fname"
                name="fname"
                placeholder="Enter Name"
                required>
            <br>
            <label for="regno">Registration no:</label>
            <input
                type="text"
                id="regno"
                name="regno"
                placeholder="Enter Registration no"
                required>
            <br>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required>
            <br><br>
            <div style="text-align:center;">
                <button type="submit" class="submit">
                    Register
                </button>
            </div>
        </form>
    </div>
</body>
</html>
