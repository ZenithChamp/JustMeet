<html>
    <head>
        <style>
        body{
            background-image: url('/static/RegH.png'); 
            background-size: cover;                  
            background-position: center;            
            background-repeat: no-repeat;           
            background-attachment: fixed;
        }
        .title{
            font-weight:bold;
            font-size:58px;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-style:bold;
            color:rgba(232, 185, 31, 0.777);
            margin-bottom:0px;
        }
        .subtitle{
          position:fixed;
          top:50px;
          left:58px;
            font-weight:bold;
            font-size:28px;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-style:bold;
            color:rgba(232, 185, 31, 0.777);
            margin-bottom:1px;
        }
        .sidepanel {
  height: 100%;
  width: 0; 
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;  
  transition: 0.3s ease; 
  padding-top: 60px;
}

.sidepanel a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: white;
  font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  display: block;
  transition: 0.3s;
}

.sidepanel a:hover {
  color: #f1f1f1;
}
.closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}
  .openbtn {
    background-color:transparent;
    color:white;
    cursor:pointer;
    font-weight:bold;
    font-size:25px;
    height:50px;
    width:50px;
}
.main-content{
    display:flex;
}
        </style>
        </head>
    <body>
        <p class="title">Just Meet</p>
      <div id="mySidepanel" class="sidepanel">
        <button class="closebtn" onclick="closeNav()">&times;</button>
        <a href="/">Home</a>
        <a href="/timetable">Time Table</a>
        <a href="#">Friends</a>
        <a href="/profile">Profile</a>
        <a href="/register">Register</a>
        <a href="#">Contact</a>
      </div>
      <div class="main-content">
      <button class="openbtn" onclick="openNav()">&#9776;</button>
      <p class="subtitle">Time Table</p>
      </div>
      <script>
        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
        </script>
    </body>
</html>
