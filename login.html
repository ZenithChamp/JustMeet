<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background: url("/static/RegP.png") center / cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .log {
            width: 450px;
            padding: 20px;
            border-radius: 18px;
            font-size: 25px;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            background-color: transparent;
            margin-top:250px;
        }
        .submit {
            background-color: rgb(73, 70, 99);
            color: white;
            height: 45px;
            width: 250px;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .usr {
            font-size: 30px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <div class="log">
        <form action="/login" method="POST">
            <label class="usr"
                   style="display:block; text-align:center;">
                LOGIN PAGE
            </label>
            <br>
            <label for="regno">Registration no:</label>
            <input
                type="text"
                id="regno"
                name="regno"
                placeholder="Enter Registration no"
                required>
            <br>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required>
            <br><br>
            <div style="text-align:center;">
                <button type="submit" class="submit">
                    LOGIN
                </button>
            </div>
        </form>
        <p>Don't have an account? </p>
        <div onclick="location.href='/register'">
            <p style="font-size:20px; font-weight:bold;">
                Register
            </p>
            </div>
    </div>
</body>
</html>
