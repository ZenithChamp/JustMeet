<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url("/static/RegH.png") center / cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .profile-card {
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.65);
            color: white;
            text-align: center;
        }
        .profile-card h1 {
            margin-bottom: 30px;
        }
        .info {
            text-align: left;
            font-size: 18px;
            margin: 15px 0;
        }
        .sidepanel {
  height: 100%;
  width: 0; 
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;  
  transition: 0.3s ease; 
  padding-top: 60px;
}

.sidepanel a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: white;
  font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  display: block;
  transition: 0.3s;
}

.sidepanel a:hover {
  color: #f1f1f1;
}
.closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}
.openbtn {
    position: fixed;
    top: 20px;
    left: 20px;
    background-color: transparent;
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 25px;
    height: 50px;
    width: 50px;
    border: none;
    z-index: 999;
}
.dp{
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 20px auto;
    cursor: pointer;
}
.camera-box {
    display: none;
    margin-top: 10px;
    text-align: center;
}
.camera-box video {
    width: 300px;
    height: 225px;
    object-fit: cover;
    border-radius: 15px;
}
.camera-box button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
    </style>
</head>
<body>
    <button class="openbtn" onclick="openNav()">&#9776;</button>
    <div id="mySidepanel" class="sidepanel">
        <button class="closebtn" onclick="closeNav()">&times;</button>
        <a href="/">Home</a>
        <a href="/timetable">Time Table</a>
        <a href="#">Friends</a>
        <a href="/profile">Profile</a>
        <a href="/register">Register</a>
        <a href="#">Contact</a>
    </div>
    <div class="profile-card">
        <h1>My Profile</h1>
        <div class="info">
            <img src="{{ url_for('static', filename=user.profile_picture if user.profile_picture else'default_avatar.png') }}" alt="PFP" class="dp" id="profilePicture" onclick="openCamera()"><br>
        <div class="camera-box" id="cameraBox">
            <video id="camera" autoplay></video><br>
            <button type="button" onclick="takePhoto()">Take Photo</button>
            <button type="button" onclick="closeCamera()">Cancel</button>
            <canvas id="photoCanvas" style="display:none;"></canvas>
        </div>
        <div class="info">
            <b>Name:</b> {{ user.username }}
        </div>
        <div class="info">
            <b>Registration No:</b> {{ user.regno }}
        </div>
    </div>
    <script>
    let cameraStream;
function openNav() {
    document.getElementById("mySidepanel").style.width = "250px";
}
function closeNav() {
    document.getElementById("mySidepanel").style.width = "0";
}
async function openCamera() {
    const cameraBox = document.getElementById("cameraBox");
    const camera = document.getElementById("camera");
    cameraBox.style.display = "block";
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: true
        });
        camera.srcObject = cameraStream;
    } catch (error) {
        alert("Could not access the camera. Please allow camera permission.");
        console.error(error);
    }
}
async function takePhoto() {
    const camera = document.getElementById("camera");
    const canvas = document.getElementById("photoCanvas");
    const profilePicture = document.getElementById("profilePicture");
    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;
    const context = canvas.getContext("2d");
    context.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );
    profilePicture.src = canvas.toDataURL("image/png");
    canvas.toBlob(async function(blob) {
        const formData = new FormData();
        formData.append("profile_picture", blob, "profile.png");
        const response = await fetch("/upload-profile-picture", {
            method: "POST",
            body: formData
        });
        const result = await response.json();
        if (result.success) {
            console.log("Profile picture saved!");
        } else {
            alert("Could not save profile picture.");
        }
    }, "image/png");
    closeCamera();
}
function closeCamera() {
    const cameraBox = document.getElementById("cameraBox");
    cameraBox.style.display = "none";
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }
}    
    </script>
</body>
</html>
