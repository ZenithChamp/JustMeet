<!DOCTYPE html>
<html>
<head>
    <title>My Friends</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('/static/RegH.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: white;
        }
        .title {
            font-weight: bold;
            font-size: 58px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgba(232, 185, 31, 0.777);
            margin: 0;
        }
        .sidepanel {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.3s ease;
            padding-top: 60px;
        }
        .sidepanel a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: white;
            display: block;
        }
        .sidepanel a:hover {
            color: #f1f1f1;
        }
        .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        .openbtn {
            background-color: transparent;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 25px;
            height: 50px;
            width: 50px;
            border: none;
        }
        .friends-container {
            width: 700px;
            margin: 70px auto;
            text-align: center;
        }
        .friends-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 35px;
            margin-bottom: 30px;
        }
        .friend-card {
            width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid #555;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        .friend-card:hover {
            transform: scale(1.02);
            border-color: white;
        }
        .friend-picture {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }
        .friend-info {
            text-align: left;
        }
        .friend-info h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .friend-info p {
            margin: 0;
            font-size: 17px;
            color: #ccc;
        }
        .no-friends {
            margin-top: 50px;
            font-size: 22px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <p class="title">Just Meet</p>
    <div id="mySidepanel" class="sidepanel">
        <button class="closebtn" onclick="closeNav()">
            &times;
        </button>
        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/timetable">Time Table</a>
        <a href="/friends">Friends</a>
        <a href="/profile">Profile</a>
        <a href="/register">Register</a>
        <a href="#">Contact</a>
    </div>
    <button class="openbtn" onclick="openNav()">
        &#9776;
    </button>
    <div class="friends-container">
        <div class="friends-title">
            My Friends
        </div>
        {% for friend in friends %}
<div class="friend-card"
     onclick="location.href='/profile/{{ friend.regno }}'">
    <img
        src="{{ url_for('static',
        filename=friend.profile_picture
        if friend.profile_picture
        else 'default_avatar.png') }}"
        class="friend-picture"
        alt="Profile Picture"
    >
    <div class="friend-info">
        <h2>{{ friend.username }}</h2>
        <p>
            Registration No: {{ friend.regno }}
        </p>
    </div>
</div>
{% endfor %}
    </div>
    <script>
        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
    </script>
</body>
</html>
