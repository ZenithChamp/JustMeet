<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url("/static/RegH.png") center / cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .profile-card {
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.65);
            color: white;
            text-align: center;
        }
        .profile-card h1 {
            margin-bottom: 30px;
        }
        .info {
            text-align: left;
            font-size: 18px;
            margin: 15px 0;
        }
        .sidepanel {
  height: 100%;
  width: 0; 
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;  
  transition: 0.3s ease; 
  padding-top: 60px;
}

.sidepanel a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: white;
  font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  display: block;
  transition: 0.3s;
}

.sidepanel a:hover {
  color: #f1f1f1;
}
.closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}
.openbtn {
    position: fixed;
    top: 20px;
    left: 20px;
    background-color: transparent;
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 25px;
    height: 50px;
    width: 50px;
    border: none;
    z-index: 999;
}
    </style>
</head>
<body>
    <button class="openbtn" onclick="openNav()">&#9776;</button>
    <div id="mySidepanel" class="sidepanel">
        <button class="closebtn" onclick="closeNav()">&times;</button>
        <a href="/">Home</a>
        <a href="/timetable">Time Table</a>
        <a href="#">Friends</a>
        <a href="/profile">Profile</a>
        <a href="/register">Register</a>
        <a href="#">Contact</a>
    </div>
    <div class="profile-card">
        <h1>My Profile</h1>
        <div class="info">
            <b>Name:</b> {{ user.username }}
        </div>
        <div class="info">
            <b>Registration No:</b> {{ user.regno }}
        </div>
    </div>
    <script>
        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
    </script>
</body>
</html>
